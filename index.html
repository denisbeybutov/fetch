        async function getPostsWithComments (count) {
            const headersPosts = await fetch('https://jsonplaceholder.typicode.com/posts');
            posts = await headersPosts.json();
            filterPosts = posts.filter(post => post.id <= count)
            // console.log(filterPosts)

            const headerComments = await fetch('https://jsonplaceholder.typicode.com/comments');
            const comments = await headerComments.json();
            // console.log(comments)
            
            let result = filterPosts.map((post)=>{
                const arrOfComments = [];
                for(let comment of comments) {
                    if (comment.postId === post.id) {
                        // console.log(comment);
                        arrOfComments.push(comment);
                    }
                    post = {...post, arrOfComments};
                }
                // console.log(post);
                return post;
            })

            return result;

        }
        
getPostsWithComments(5).then(console.log);
